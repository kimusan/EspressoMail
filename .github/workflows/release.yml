name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
      release_notes:
        description: 'Full GitHub release notes in Markdown (optional; overrides auto-extracted notes)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  # --------------------------------------------------------------------------
  # 0. Test Suite Validation Gatekeeper
  # --------------------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,images]

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -v

  # --------------------------------------------------------------------------
  # 1. Build Python Package (sdist + wheel) and Publish to PyPI
  # --------------------------------------------------------------------------
  build-pypi:
    name: Build & Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Upload PyPI distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          retention-days: 7

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 2. Build Standalone Binaries (Linux & Windows) via PyInstaller
  # --------------------------------------------------------------------------
  build-binaries:
    name: Build Standalone Binary (${{ matrix.platform }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: espressomail
            output_name: espressomail-linux-x86_64
          - os: windows-latest
            platform: windows
            binary_name: espressomail.exe
            output_name: espressomail-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller packaging/pyinstaller/espressomail.spec --clean -y
          mkdir -p dist/binaries
          cp dist/espressomail dist/binaries/${{ matrix.output_name }}
          chmod +x dist/binaries/${{ matrix.output_name }}
          tar -czvf dist/binaries/${{ matrix.output_name }}.tar.gz -C dist/binaries ${{ matrix.output_name }}

      - name: Build standalone executable with PyInstaller (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller packaging/pyinstaller/espressomail.spec --clean -y
          New-Item -ItemType Directory -Force -Path dist/binaries
          Copy-Item dist/espressomail.exe dist/binaries/${{ matrix.output_name }}
          Compress-Archive -Path dist/binaries/${{ matrix.output_name }} -DestinationPath dist/binaries/espressomail-windows-x86_64.zip

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/binaries/*
          retention-days: 7

  # --------------------------------------------------------------------------
  # 3. Build Native Linux Packages (DEB, RPM, Arch Linux PKG)
  # --------------------------------------------------------------------------
  build-packages:
    name: Build Linux Packages (DEB, RPM, Arch)
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Linux standalone binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: dist-bin/

      - name: Install packaging utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm zstd libarchive-tools

      - name: Prepare binary for packaging
        run: |
          mkdir -p dist
          cp dist-bin/espressomail-linux-x86_64 dist/espressomail
          chmod +x dist/espressomail

      - name: Extract version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TAG="${TAG#v}"
          else
            TAG=$(python3 -c "import sys; sys.path.insert(0, 'src'); import espressomail; print(espressomail.__version__)")
          fi
          echo "VERSION=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building packages for version: ${TAG}"

      - name: Build Debian (.deb) package
        run: |
          bash packaging/deb/build_deb.sh "${{ steps.get_version.outputs.VERSION }}" dist/espressomail dist/packages

      - name: Build RPM (.rpm) package
        run: |
          bash packaging/rpm/build_rpm.sh "${{ steps.get_version.outputs.VERSION }}" dist/espressomail dist/packages

      - name: Build Arch Linux (.pkg.tar.zst) package
        run: |
          bash packaging/arch/build_arch.sh "${{ steps.get_version.outputs.VERSION }}" dist/espressomail dist/packages

      - name: Upload Linux Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/packages/*
          retention-days: 7

  # --------------------------------------------------------------------------
  # 4. Finalize & Publish GitHub Release with all artifacts attached
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-pypi, build-binaries, build-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Consolidate release artifacts
        run: |
          mkdir -p release-assets
          find all-artifacts -type f \( \
            -name "*.whl" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.pkg.tar.*" -o \
            -name "espressomail-linux-x86_64" -o \
            -name "espressomail-windows-x86_64.exe" \
          \) -exec cp {} release-assets/ \;

          cd release-assets
          echo "=== Generating SHA256 Checksums ==="
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract release notes (Git tag message and CHANGELOG)
        id: extract_notes
        run: |
          python3 -c "
          import re, subprocess, sys
          from pathlib import Path

          tag = '${{ github.ref_name || github.event.inputs.tag_name }}'
          version = tag.lstrip('v') if tag else ''

          manual_notes = """${{ github.event.inputs.release_notes }}""".strip()
          if manual_notes:
              Path('RELEASE_NOTES.md').write_text(manual_notes + '\n', encoding='utf-8')
              print('--- MANUAL RELEASE NOTES BODY ---')
              print(manual_notes)
              print('---------------------------------')
              sys.exit(0)

          # Extract git tag annotation message if present
          tag_msg = ''
          try:
              res = subprocess.run(['git', 'tag', '-l', '--format=%(contents)', tag], capture_output=True, text=True)
              tag_msg = res.stdout.strip()
          except Exception:
              pass

          # Extract matching section from CHANGELOG.md
          changelog_path = Path('CHANGELOG.md')
          changelog_notes = ''
          if changelog_path.is_file() and version:
              content = changelog_path.read_text(encoding='utf-8')
              pattern = rf'##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  changelog_notes = match.group(1).strip()

          body_parts = []
          # If tag_msg has custom content (not just 'Release vX.Y.Z'), include it at top
          default_tag_msg = f'Release {tag}'
          if tag_msg and tag_msg != default_tag_msg and tag_msg not in changelog_notes:
              first_line = tag_msg.split('\n')[0].strip()
              if first_line not in changelog_notes:
                  body_parts.append(f'### {tag_msg}\n')

          if changelog_notes:
              body_parts.append(changelog_notes)
          elif tag_msg:
              body_parts.append(tag_msg)
          else:
              body_parts.append(f'### EspressoMail {tag}\n\nAutomated release with multi-platform binary executables, native Linux packages, and PyPI distribution.')

          release_body = '\n\n'.join(body_parts).strip()
          Path('RELEASE_NOTES.md').write_text(release_body + '\n', encoding='utf-8')
          print('--- RELEASE NOTES BODY ---')
          print(release_body)
          print('--------------------------')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          name: EspressoMail ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
